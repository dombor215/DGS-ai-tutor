<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DGS AI Tutor</title>

<style>
  :root {
    --primary-color: #4A90E2;
    --secondary-color: #357ABD;
    --user-bg: #d1e7dd;
    --bot-bg: #ffffff;
    --background: #f5f7fa;
    --border-radius: 12px;
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    margin: 0;
    background: var(--background);
  }

  header {
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    color: white;
    padding: 24px 20px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 16px rgba(0, 0, 0, 0.15);
    position: relative;
  }

  .copyright {
    font-size: 12px;
    font-weight: 400;
    margin-top: 8px;
    opacity: 0.9;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    margin: 0;
    padding: 14px 18px;
    border-radius: var(--border-radius);
    max-width: 70%;
    box-shadow: var(--shadow);
    line-height: 1.6;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease-in;
    font-size: 15px;
  }

  .user {
    background: var(--user-bg);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    white-space: pre-wrap;
  }

  .bot {
    background: var(--bot-bg);
    border: 1px solid #e0e0e0;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  /* processing bubble + cursor */
  .bot.processing { position: relative; overflow: hidden; }

  .typing {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .dots { display: inline-flex; gap: 4px; padding: 2px 0; }
  .dot {
    width: 7px; height: 7px; border-radius: 999px;
    background: #94a3b8; opacity: 0.35;
    animation: bounce 1.1s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.30s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
    40% { transform: translateY(-5px); opacity: 0.9; }
  }

  .stream-cursor {
    display: inline-block;
    width: 8px;
    margin-left: 2px;
    border-left: 2px solid rgba(53, 122, 189, 0.9);
    height: 1em;
    transform: translateY(2px);
    animation: blink 0.9s step-end infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }

  /* Markdown styling for bot messages */
  .bot h1, .bot h2, .bot h3, .bot h4 {
    margin: 16px 0 8px 0;
    color: var(--secondary-color);
    line-height: 1.3;
  }
  .bot h1 { font-size: 1.5em; font-weight: 700; }
  .bot h2 { font-size: 1.3em; font-weight: 700; }
  .bot h3 { font-size: 1.1em; font-weight: 600; }
  .bot h4 { font-size: 1em; font-weight: 600; }

  .bot p { margin: 8px 0; }
  .bot ul, .bot ol { margin: 8px 0; padding-left: 24px; }
  .bot code {
    background: #f4f4f4;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: #d63384;
  }
  .bot pre {
    background: #f4f4f4;
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 8px 0;
  }

  #inputArea {
    display: flex;
    align-items: flex-end;
    padding: 16px;
    background: #fff;
    border-top: 1px solid #e0e0e0;
    gap: 10px;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.05);
  }

  #messageInput {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    outline: none;
    resize: none;
    overflow-y: auto;
    font-family: inherit;
    line-height: 1.5;
    max-height: 150px;
    min-height: 44px;
  }

  .button-group { display: flex; gap: 8px; align-items: flex-end; }

  button {
    padding: 12px 16px;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 18px;
    transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    box-shadow: var(--shadow);
    min-width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<!-- NEW: MathJax config (must be before the script include) -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)']],
      displayMath: [['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      // Don't try to interpret code blocks as TeX
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<!-- NEW: MathJax library -->
<script defer="" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>

<body>
<header id="pageHeader">
  <span id="headerTitle"></span>
  <div class="copyright"></div>
</header>

<div id="chat"></div>

<div id="inputArea">
  <textarea id="messageInput" placeholder="Type a message..." rows="1"></textarea>
  <div class="button-group">
    <button id="sendBtn" title="Send message" onclick="sendMessage()">➤</button>
    <button id="apiBtn" title="Set key" onclick="setApiKey()">🔑</button>
    <button id="exportBtn" title="Save chat">💾</button>
    <button id="importBtn" title="Import chat">📂</button>
  </div>
</div>

<script src="config_data.js"></script>
<script>
  let sessionStartTime = null;

  window.addEventListener("DOMContentLoaded", () => {
    sessionStartTime = new Date().toISOString();
    document.getElementById("headerTitle").textContent = "DGS AI Tutor";
    addMessage(FIRST_MESSAGE, "bot");
  });

  const chatBox = document.getElementById("chat");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  let isProcessing = false;
  let currentTypingEl = null;

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    const newHeight = Math.min(input.scrollHeight, 150);
    input.style.height = newHeight + "px";
  });

  // NEW: Convert $$...$$ to \[...\] so MathJax renders it as display math.
  // (Optional, but helps if the model outputs $$ blocks.)
  function normalizeLatexDelimiters(text) {
    return text.replace(/\$\$([\s\S]*?)\$\$/g, (_, inner) => `\\[${inner}\\]`);
  }

  // Enhanced Markdown rendering function (unchanged except call normalizeLatexDelimiters)
  function renderMarkdown(text) {
    text = normalizeLatexDelimiters(text);

    let html = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');

    const lines = html.split('\n');
    const processed = [];
    let inList = false;
    let listType = null;
    let listItems = [];

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];
      const ulMatch = line.match(/^[\s]*[\*\-]\s+(.+)$/);
      const olMatch = line.match(/^[\s]*\d+\.\s+(.+)$/);

      if (ulMatch || olMatch) {
        const content = ulMatch ? ulMatch[1] : olMatch[1];
        const currentType = ulMatch ? 'ul' : 'ol';

        if (!inList) {
          inList = true;
          listType = currentType;
          listItems = [];
        } else if (listType !== currentType) {
          processed.push(`<${listType}>${listItems.map(item => `<li>${item}</li>`).join('')}</${listType}>`);
          listItems = [];
          listType = currentType;
        }
        listItems.push(content);
      } else {
        if (inList) {
          processed.push(`<${listType}>${listItems.map(item => `<li>${item}</li>`).join('')}</${listType}>`);
          inList = false;
          listType = null;
          listItems = [];
        }
        processed.push(line);
      }
    }
    if (inList) {
      processed.push(`<${listType}>${listItems.map(item => `<li>${item}</li>`).join('')}</${listType}>`);
    }

    html = processed.join('\n');

    html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

    html = html.replace(/^&gt;\s+(.+)$/gm, '<blockquote>$1</blockquote>');
    html = html.replace(/^[-*_]{3,}$/gm, '<hr>');

    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');

    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    html = html.replace(/_(.+?)_/g, '<em>$1</em>');

    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    html = html.replace(/(?<!href=")(?<!">)((?:https?:\/\/)[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');

    const finalLines = html.split('\n');
    const withParagraphs = [];

    for (let line of finalLines) {
      const trimmed = line.trim();
      if (trimmed === '') {
        withParagraphs.push('');
      } else if (trimmed.match(/^<(h[1-6]|ul|ol|pre|blockquote|hr)/)) {
        withParagraphs.push(line);
      } else if (!trimmed.match(/^<\/(ul|ol|li|blockquote)>$/)) {
        withParagraphs.push(`<p>${line}</p>`);
      } else {
        withParagraphs.push(line);
      }
    }

    return withParagraphs.join('\n');
  }

  // NEW: ask MathJax to typeset only the new/updated element
  async function typesetMath(element) {
    try {
      if (window.MathJax && MathJax.typesetPromise) {
        await MathJax.typesetPromise([element]);
      }
    } catch (e) {
      console.warn("MathJax typeset failed:", e);
    }
  }

  function addMessage(content, sender) {
    const msg = document.createElement("div");
    msg.classList.add("message", sender);

    if (sender === "bot") {
      msg.innerHTML = renderMarkdown(content);
    } else {
      msg.textContent = content;
    }

    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;

    if (sender === "bot") {
      // NEW: render math for this message
      typesetMath(msg);
    }

    return msg;
  }

  function addProcessingMessage() {
    const msg = document.createElement("div");
    msg.classList.add("message", "bot", "processing");
    msg.innerHTML = `
      <div class="typing" aria-label="Assistant is typing">
        <span class="dots" aria-hidden="true">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
      </div>
    `;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
    return msg;
  }

  async function typeBotMessage(element, fullText) {
    element.classList.remove("processing");
    element.innerHTML = "";

    const textEl = document.createElement("div");
    textEl.textContent = "";
    element.appendChild(textEl);

    const cursor = document.createElement("span");
    cursor.className = "stream-cursor";
    element.appendChild(cursor);

    const baseDelay = 12;
    const chunkSize = 2;

    let i = 0;
    while (i < fullText.length) {
      const nearBottom = (chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight) < 120;

      i = Math.min(i + chunkSize, fullText.length);
      textEl.textContent = fullText.slice(0, i);

      if (nearBottom) chatBox.scrollTop = chatBox.scrollHeight;

      const lastChar = fullText[i - 1];
      const delay = (lastChar === "\n") ? baseDelay * 3 : baseDelay;
      await new Promise(r => setTimeout(r, delay));
    }

    cursor.remove();

    // Final: render markdown + math
    element.innerHTML = renderMarkdown(fullText);
    chatBox.scrollTop = chatBox.scrollHeight;

    // NEW: typeset math after final HTML is in place
    await typesetMath(element);
  }

  let messages = [{ role: "system", content: CONTENT_USER }];

  function setApiKey() {
    const key = prompt("Enter key:");
    if (key) {
      localStorage.setItem("api_key", key.trim());
      alert("Key saved.");
    }
  }

  function getApiKey() {
    const key = localStorage.getItem("api_key");
    return key ? API_FIRST_PART + key : null;
  }

  function setUiProcessing(on) {
    isProcessing = on;
    sendBtn.disabled = on;
    input.disabled = on;
  }

  async function sendMessage() {
    if (isProcessing) return;

    const userMessage = input.value.trim();
    if (!userMessage) return;

    addMessage(userMessage, "user");
    messages.push({ role: "user", content: userMessage });
    input.value = "";
    input.style.height = "auto";

    const apiKey = getApiKey();
    if (!apiKey) {
      addMessage("⚠️ Please insert the key (click 🔑).", "bot");
      return;
    }

    setUiProcessing(true);
    currentTypingEl = addProcessingMessage();

    try {
      // KEEP API CALL INTACT
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: MODEL_NAME,
          messages: messages
        })
      });

      const data = await response.json();
      const botReply = data.choices?.[0]?.message?.content || "No response.";

      await typeBotMessage(currentTypingEl, botReply);
      messages.push({ role: "assistant", content: botReply });
    } catch (error) {
      console.error("Error:", error);
      if (currentTypingEl) {
        currentTypingEl.classList.remove("processing");
        currentTypingEl.innerHTML = renderMarkdown("❌ Error: Could not connect to API.");
      } else {
        addMessage("❌ Error: Could not connect to API.", "bot");
      }
    } finally {
      currentTypingEl = null;
      setUiProcessing(false);
      input.focus();
    }
  }

  document.getElementById("exportBtn").addEventListener("click", () => {
    try {
      const exportData = {
        sessionStartTime: sessionStartTime,
        exportTime: new Date().toISOString(),
        messages: messages
      };
      const chatData = JSON.stringify(exportData, null, 2);
      const file = new Blob([chatData], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(file);
      a.download = "chat_export.json";
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (error) {
      console.error("Export failed:", error);
      alert("❌ Failed to export chat.");
    }
  });

  document.getElementById("importBtn").addEventListener("click", async () => {
    try {
      if (window.showOpenFilePicker) {
        const [fileHandle] = await window.showOpenFilePicker({
          types: [{ description: "JSON Files", accept: { "application/json": [".json"] } }],
          multiple: false
        });
        const file = await fileHandle.getFile();
        const text = await file.text();
        const importedData = JSON.parse(text);

        const importedMessages = Array.isArray(importedData) ? importedData : (importedData.messages || []);

        if (Array.isArray(importedMessages)) {
          messages = importedMessages;
          chatBox.innerHTML = "";
          importedMessages.forEach(m => {
            if (m.role !== "system") {
              addMessage(m.content, m.role === "user" ? "user" : "bot");
            }
          });
        } else {
          alert("❌ Invalid chat file.");
        }
      } else {
        alert("⚠️ File import not supported in this browser.");
      }
    } catch (error) {
      console.error("Import failed:", error);
      alert("❌ Failed to import chat.");
    }
  });

document.getElementById("headerTitle").textContent = headerTitle;
document.querySelector(".copyright").textContent = copyrightText;
document.title = headerTitle;
</script>


</body></html>
